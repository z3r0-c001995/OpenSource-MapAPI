<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MapAPI Web Example</title>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      #map { width: 100%; height: 80vh; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      fetch('http://localhost:3000/api/maps/config').then(r => r.json()).then(cfg => {
        new maplibregl.Map({
          container: 'map',
          style: cfg.data.styleUrl,
          center: [28.2871, -15.4067],
          zoom: 11
        });
      });
    </script>
  </body>
</html>
